<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>건물주이야기</title>
    <script>
        (function () {
            if ("scrollRestoration" in window.history) {
                window.history.scrollRestoration = "manual";
            }
            if (window.sessionStorage.getItem("buildingStory.scrollY") !== null) {
                document.documentElement.classList.add("restore-scroll-pending");
            }
            try {
                const stockTheme = window.localStorage.getItem("buildingStory.stockTheme");
                document.documentElement.dataset.stockTheme = stockTheme === "light" ? "light" : "dark";
            } catch (error) {
                document.documentElement.dataset.stockTheme = "dark";
            }
            try {
                const companyTheme = window.localStorage.getItem("buildingStory.companyTheme");
                document.documentElement.dataset.companyTheme = companyTheme === "light" ? "light" : "dark";
            } catch (error) {
                document.documentElement.dataset.companyTheme = "dark";
            }
        })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=property-headquarters-v2">
    <link rel="stylesheet" th:if="${viewMode == 'stocks'}" href="/stock.css?v=stock-workspace-v20">
    <link rel="stylesheet" th:if="${viewMode == 'company'}" href="/company-reporting.css?v=company-reporting-v2">
    <link rel="stylesheet" th:if="${viewMode == 'company'}" href="/company.css?v=company-theme-v7">
</head>
<body th:class="${(screenPaused ? 'game-paused ' : '') + (viewMode == 'stocks' ? 'view-stocks' : (viewMode == 'company' ? 'view-company' : ''))}"
      th:attr="data-player-paused=${screenPaused},data-elapsed-days=${player.elapsedDays},data-view-mode=${viewMode}">
<!--
main.html은 로그인 후 플레이어가 가장 오래 머무는 메인 화면이다.
MainPageModelAssembler가 Model에 담은 값들을 Thymeleaf 표현식(${...})으로 읽어
도시/주식/비서/이벤트 상태를 한 번에 렌더링한다.
-->
<div class="app">
    <header class="topbar">
        <div class="brand">
            <span class="logo">B</span>
            <div>
                <h1>건물주이야기</h1>
                <p th:text="${player.username}">사용자</p>
            </div>
        </div>

        <div class="status-grid">
            <div class="status-card">
                <span>현금</span>
                <strong id="cashValue" class="money" th:text="${@moneyText.format(player.cash)}">0원</strong>
                <small class="status-subline">대출 <b th:text="${@moneyText.format(loanRemainingRepayment)}">0원</b></small>
            </div>
            <div class="status-card" th:if="${viewMode != 'company'}">
                <span>총 월세</span>
                <strong id="totalMonthlyRentValue" class="money" th:text="${@moneyText.format(totalMonthlyRent)}">0원</strong>
            </div>
            <div class="status-card" th:if="${viewMode == 'company'}">
                <span th:text="${companyTopMetrics[0].label}">기업 지표</span>
                <strong class="money" th:text="${companyTopMetrics[0].value}">0원</strong>
                <small class="status-subline" th:text="${companyTopMetrics[0].note}">설명</small>
            </div>
            <div class="status-card" th:if="${viewMode != 'company'}">
                <span>증권 예수금</span>
                <strong id="securitiesCashValue" class="money" th:text="${@gameService.stockMoneyText(player.securitiesCash)}">0원</strong>
            </div>
            <div class="status-card" th:if="${viewMode == 'company'}">
                <span th:text="${companyTopMetrics[1].label}">기업 지표</span>
                <strong class="money" th:text="${companyTopMetrics[1].value}">0원</strong>
                <small class="status-subline" th:classappend="${companyTopMetrics[1].tone}" th:text="${companyTopMetrics[1].note}">설명</small>
            </div>
            <div class="status-card" th:if="${viewMode != 'company' && player.employed}">
                <span>직장</span>
                <strong th:text="${player.employed ? '재직중' : '퇴사'}">재직중</strong>
            </div>
            <div class="status-card" th:if="${viewMode == 'company'}">
                <span th:text="${companyTopMetrics[2].label}">기업 지표</span>
                <strong class="money" th:text="${companyTopMetrics[2].value}">0원</strong>
                <small class="status-subline" th:classappend="${companyTopMetrics[2].tone}" th:text="${companyTopMetrics[2].note}">설명</small>
            </div>
            <div class="status-card">
                <span>평판</span>
                <strong th:text="${@gameService.reputationText(player.reputation)}">0</strong>
                <small class="status-subline">칭호 <b th:text="${player.title}">칭호</b></small>
            </div>
            <div class="status-card date-card">
                <span>날짜</span>
                <strong th:text="${player.currentDateText}">1년 1월 1일</strong>
                <div class="tick-progress" aria-label="다음 날 진행률">
                    <span id="dayProgress"></span>
                </div>
                <small id="dayProgressText">다음 날 0%</small>
            </div>
        </div>
    </header>

    <div id="flashToast" th:if="${notice}" class="toast show" th:text="${notice}">알림</div>

    <nav class="city-tabs" aria-label="도시 선택">
        <form method="post" action="/city" th:each="city : ${cities}">
            <input type="hidden" name="city" th:value="${city}">
            <button type="submit"
                    th:disabled="${cityUnlocks.get(city) != true}"
                    th:classappend="${cityUnlocks.get(city) != true} ? ' locked' : (${viewMode == 'city' && city == player.currentCity} ? ' active' : '')">
                <span th:text="${city}">도시</span>
                <span th:if="${cityUnlocks.get(city) != true}">잠김</span>
                <span class="repair-count-badge" th:if="${repairCountsByCity.get(city) != null && repairCountsByCity.get(city) > 0}" th:text="${repairCountsByCity.get(city)}">0</span>
            </button>
        </form>
        <a class="info-tab" th:if="${stockContentUnlocked}" href="/main?view=stocks" th:classappend="${viewMode == 'stocks'} ? ' active'">주식</a>
        <span class="info-tab locked" th:if="${!stockContentUnlocked}" th:text="'주식 · ' + ${stockContentStatus}">주식</span>
        <a class="info-tab" href="/info">정보</a>
        <a class="info-tab" th:if="${companyContentUnlocked}" href="/main?view=company" th:classappend="${viewMode == 'company'} ? ' active'">기업</a>
        <span class="info-tab locked" th:if="${!companyContentUnlocked}" th:text="'기업 · ' + ${companyContentStatus}">기업</span>
        <form class="tab-pause-form" method="post" action="/pause/toggle">
            <input type="hidden" name="redirectView" th:value="${viewMode}">
            <input type="hidden" name="selectedStockKey" th:if="${viewMode == 'stocks'}" th:value="${selectedStockKey}">
            <button class="tab-pause-button" type="submit" th:text="${player.paused ? '진행 재개' : '일시정지'}">일시정지</button>
        </form>
        <div class="company-theme-switch" th:if="${viewMode == 'company'}" role="group" aria-label="기업 화면 테마">
            <button type="button" data-company-theme-option="light">라이트</button>
            <button type="button" data-company-theme-option="dark">다크</button>
        </div>
        <form class="company-header-logout" th:if="${viewMode == 'company'}" method="post" action="/logout">
            <button type="submit">로그아웃</button>
        </form>
    </nav>

    <th:block th:if="${viewMode == 'city'}">
        <main class="layout">
            <section th:replace="~{fragments/main-city-panel :: cityPanel}"></section>
            <aside th:replace="~{fragments/main-secretary-panel :: secretaryPanel}"></aside>
        </main>
        <section th:replace="~{fragments/main-market :: market}"></section>
        <section th:replace="~{fragments/main-info-grid :: infoGrid}"></section>
    </th:block>
    <th:block th:if="${viewMode == 'stocks'}">
        <section class="stock-market-overview" data-stock-market-overview aria-label="시장 요약">
            <header>
                <span>MARKET SNAPSHOT</span>
                <strong>시장 요약</strong>
                <div class="stock-update-status">
                    <small th:text="'주가 갱신 ' + ${stockMarketStatus.nextUpdateDateText()} + ' · D-' + ${stockMarketStatus.daysUntilNextUpdate()}">주가 갱신 D-5</small>
                    <i aria-hidden="true"><b th:style="'width:' + ${stockMarketStatus.progressPercent()} + '%'" style="width: 0"></b></i>
                </div>
            </header>
            <dl>
                <div>
                    <dt th:text="'종합지수 · ' + ${stockMarketStatus.indexConstituentCount()} + '종목'">종합지수 · 15종목</dt>
                    <dd th:class="${stockMarketStatus.indexDirection()}"
                        th:text="${stockMarketStatus.indexValueText()} + ' · ' + ${stockMarketStatus.indexChangeText()}">1,000.00 · +0.00%</dd>
                </div>
                <div>
                    <dt>경기국면</dt>
                    <dd th:text="${stockMarketStatus.regimeText()}">중립</dd>
                </div>
                <div>
                    <dt>상승 / 하락 / 보합</dt>
                    <dd class="stock-market-breadth"><span class="up" th:text="${stockRisingCount}">0</span> / <span class="down" th:text="${stockFallingCount}">0</span> / <span class="flat" th:text="${stockFlatCount}">0</span></dd>
                </div>
                <div>
                    <dt>시장이슈</dt>
                    <dd th:if="${stockMarketStatus.hasActiveNews()}" th:class="${stockMarketStatus.activeNewsDirection()}" th:text="${stockMarketStatus.activeNewsText()}">시장 호재 적용중</dd>
                    <dd th:unless="${stockMarketStatus.hasActiveNews()}" class="flat">없음</dd>
                </div>
            </dl>
            <div class="stock-theme-switch" role="group" aria-label="주식 화면 테마">
                <button type="button" data-stock-theme-option="light">라이트</button>
                <button type="button" data-stock-theme-option="dark">다크</button>
            </div>
        </section>
        <main class="stock-layout">
            <section th:replace="~{fragments/main-stock-panel :: stockPanel}"></section>
            <aside th:replace="~{fragments/main-stock-panel :: stockSidePanel}"></aside>
        </main>
    </th:block>
    <th:block th:if="${viewMode == 'company'}">
        <main th:replace="~{fragments/main-company-panel :: companyPanel}"></main>
    </th:block>

    <form class="logout-form" th:unless="${viewMode == 'company'}" method="post" action="/logout">
        <button class="secondary" type="submit">로그아웃</button>
    </form>

    <div class="toast" id="toast"></div>

    <div th:replace="~{fragments/main-modals :: modals}"></div>
</div>

<script type="module" src="/app.js?v=company-detail-v4"></script>
</body>
</html>
